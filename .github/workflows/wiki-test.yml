# Temporary: one test page on the SourceForge wiki, to see how it renders
# tables, code blocks, quotes and links before writing the real sync.
name: wiki-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Post a test page
        env:
          SF_WIKI_TOKEN: ${{ secrets.SF_WIKI_TOKEN }}
        run: |
          cat >page.md <<'MD'
          > This page is a test of how the wiki shows the documentation. It will be removed.

          ## A table

          | Path | Behaviour |
          |---|---|
          | `/usr` | **Read-only.** Comes from the image. |
          | `/etc` | **Kept.** |

          ## A code block

          ```sh
          sudo grub-editenv /boot/grub/grubenv list
          ```

          ## Links

          - [A wiki page](Install Guide)
          - [Same page, anchor](#a-table)
          - [External](https://d77void.github.io/immutable-docs/)
          MD
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SF_WIKI_TOKEN" \
            --data-urlencode "text@page.md" \
            "https://sourceforge.net/rest/p/d77void/wiki/Docs%20test")
          echo "HTTP $code"; head -c 300 resp.txt; echo
          [ "$code" -lt 300 ]
